database:
  cleaned_db: smgui/memory.db
  openchronicle_db: ~/.openchronicle/index.db
  screenpipe_db: ~/.screenpipe/db.sqlite
embedding:
  enabled: true
  provider: openai
  model: text-embedding-3-small
  base_url: https://openrouter.ai/api/v1
  api_key: ""
  api_key_env: EMBEDDING_API_KEY
  dimensions: 1536
  normalize: true
model:
  api_key: ""
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  api_key: ""
  api_key_env: LLM_API_KEY
  temperature: 0.2
openchronicle:
  bin_path: /Users/zhouboyu/.local/bin/openchronicle
  data_dir: ~/.openchronicle
screen_memory:
  enabled: true
  fact_clustering_interval_hours: 1
  ingest_interval_minutes: 5
  observation_interval_hours: 3
screenpipe:
  api_token: ''
  api_url: http://localhost:3030
  bin_path: /opt/homebrew/bin/screenpipe
  data_dir: ~/.screenpipe
  pipes_dir: ~/.screenpipe/pipes
  use_audio: false
