# ============================================================
# PME - Personal Memory Engine
# Configuration File
# ============================================================
# Copy this file to config.yaml and fill in your own paths.
# All ~ paths are automatically expanded to your home directory.

# --- Database Paths ---
database:
  # Where Screenpipe stores its SQLite database
  screenpipe_db: "/Users/zhouboyu/Documents/xreal/pme/screenpipe.sqlite"

  # Where OpenChronicle stores its SQLite database
  openchronicle_db: "/Users/zhouboyu/Documents/xreal/pme/openchronicle.db"
  
  # Where PME writes the cleaned, deduplicated output database
  # This is the file you'll use for RAG / Q&A queries
  cleaned_db: "./pme_memory.db"

# --- Screenpipe Settings ---
screenpipe:
  # HTTP API base URL (default port 3030)
  api_url: "http://localhost:3030"

  # Full path to the screenpipe binary
  # Homebrew default: /opt/homebrew/bin/screenpipe
  bin_path: "/opt/homebrew/bin/screenpipe"

  # Bearer token for API authentication.
  # Leave empty ("") - PME will auto-read it from ~/.screenpipe/auth_token
  # or from the SCREENPIPE_API_TOKEN environment variable.
  api_token: ""

# --- OpenChronicle Settings ---
openchronicle:
  # Full path to the openchronicle binary
  bin_path: "~/.local/bin/openchronicle"
  # Link AXTree captures to nearby Screenpipe records within this many seconds.
  record_link_window_seconds: 6
  max_events_per_record: 3

# --- PME Cleaning Policy ---
# Controls how often OCR snapshots are kept per window state.
# Smaller values = more records kept; larger values = more aggressive dedup.
cleaning_policy:
  # Seconds between captures for the active (focused) window
  active_interval: 2

  # Seconds between captures for inactive (background) windows
  bg_interval: 30

  # Min seconds between captures triggered by AX tree dynamic changes
  ax_trigger_interval: 10

  # Minimum OCR quality score to keep after text normalization
  min_quality: 0.18

  # Drop these high-frequency system surfaces before quality scoring
  ignored_apps:
    - "控制中心"
    - "通知中心"
    - "程序坞"
    - "Control Center"
    - "Notification Center"
    - "Dock"

  # These system apps can be useful, but only when focused and text-rich
  system_apps_keep_if_focused:
    - "系统设置"
    - "System Settings"

  # Drop records whose normalized OCR has fewer useful letters/digits/CJK chars
  min_useful_chars: 8

# --- View Reconstruction ---
view_generation:
  # Group records from the same app/window into one view while gaps stay under this threshold.
  gap_minutes: 8
  # Force a new view after this many minutes even if the same app/window remains active.
  max_minutes: 30

# --- Segment Reconstruction ---
# Groups cleaned OCR snapshots into higher-level activity blocks.
segment_generation:
  # Enable LLM summaries for segments during cleaning
  enable_LLM_summary: true

  # Start a new segment after this many minutes without related activity
  gap_minutes: 8

  # Force a new segment after this many minutes even if activity is continuous
  max_minutes: 30

  # Split after a focused app/window switch lasts longer than this many minutes
  focus_switch_split_minutes: 5

  # LLM settings used when enable_LLM_summary is true
  llm_model: "deepseek-v4-flash"
  llm_base_url: "https://api.deepseek.com/v1"
  llm_api_key_env: "DEEPSEEK_API_KEY"
  llm_budget: 1
  llm_timeout: 60

# --- Cross-time Window Workstream Reconstruction ---
# Groups related views across non-continuous time ranges within a work context.
window_workstream_generation:
  enabled: true
  # Optional. Keep false to avoid LLM calls during routine view-to-workstream matching.
  enable_LLM_summary: false
  min_relevance: 0.35
  title_similarity_threshold: 0.82
  max_member_views_for_matching: 12
  max_views_for_summary: 24
  pair_min_score: 0.45
  min_support_ratio: 0.5
  top_k: 3
  min_top_k_avg: 0.55
  cluster_seed_min_score: 0.65
  cluster_merge_passes: 1
  cluster_merge_support_ratio: 0.5
  cluster_merge_min_score: 0.35
  max_time_gap_days: 30
  primary_match_since: current_week
  historical_min_entity_overlap: 2
  llm_model: "deepseek-v4-flash"
  llm_base_url: "https://api.deepseek.com/v1"
  llm_api_key_env: "DEEPSEEK_API_KEY"
  llm_budget: 1
  llm_timeout: 60

# --- Screen Memory Fact/Observation Generation ---
# Converts view-level screen evidence into screen_facts, then consolidates related
# facts inside each window_workstream into screen_observations for weekly reports.
screen_memory_generation:
  enabled: true
  enable_LLM_fact_extraction: true
  enable_observation_generation: true
  enable_LLM_observation: true
  fallback_fact_when_llm_fails: false
  fallback_observation_without_llm: true
  min_facts_per_observation: 1
  fact_cluster_min_score: 0.42
  observation_merge_fact_min_score: 0.42
  observation_merge_min_score: 0.48
  observation_merge_support_ratio: 0.5
  llm_model: "deepseek-v4-flash"
  llm_base_url: "https://api.deepseek.com/v1"
  llm_api_key_env: "DEEPSEEK_API_KEY"
  fact_llm_budget: 50
  observation_llm_budget: 50
  llm_timeout: 60

# --- Cross-window Task Workstream Reconstruction ---
# Groups related window_workstream rows into task-level workstreams across apps/windows.
task_workstream_generation:
  enabled: true
  # Optional. Keep false when report_block_generation is the main LLM summarization layer.
  enable_LLM_summary: false
  min_relevance: 0.35
  title_similarity_threshold: 0.55
  title_topic_min_score: 0.20
  title_entity_min_score: 0.10
  title_text_min_score: 0.12
  semantic_similarity_threshold: 0.28
  entity_text_min_score: 0.06
  max_member_window_workstreams_for_matching: 12
  max_window_workstreams_for_summary: 16
  pair_min_score: 0.40
  min_support_ratio: 0.5
  top_k: 3
  min_top_k_avg: 0.50
  cluster_seed_min_score: 0.55
  max_time_gap_days: 30
  primary_match_since: current_week
  historical_min_entity_overlap: 2
  historical_entity_text_min_score: 0.08
  llm_model: "deepseek-v4-flash"
  llm_base_url: "https://api.deepseek.com/v1"
  llm_api_key_env: "DEEPSEEK_API_KEY"
  llm_budget: 1
  llm_timeout: 60

# --- Periodic Report Block Generation ---
# Creates one report-ready block per active task_workstream per report period.
report_block_generation:
  enabled: true
  trigger_mode: manual
  period: weekly
  week_start_day: 0
  generation_weekday: 0
  generate_last_period: false
  rerun_existing_periods: false
  enable_LLM_summary: true
  refresh_existing_llm: false
  max_views_for_summary: 40
  llm_model: "deepseek-v4-flash"
  llm_base_url: "https://api.deepseek.com/v1"
  llm_api_key_env: "DEEPSEEK_API_KEY"
  llm_budget: 50
  llm_timeout: 60

# --- Web UI ---
gui:
  host: "127.0.0.1"
  port: 5555

# --- LLM Settings (optional, only needed for `pme_cli.py ask --ask`) ---
llm:
  # litellm provider string: openai / deepseek / anthropic / gemini / etc.
  provider: "openai"

  # Model name as understood by litellm
  model: "gpt-4o-mini"

  # Sampling temperature (0.0 = deterministic, 1.0 = creative)
  temperature: 0.2
